# End-to-end tests: frontend + backend on a throwaway database, driven by Playwright.
# The backend lives in its own repo and is checked out next to the frontend. Each run creates its own
# ticketflow_e2e_* database on the MySQL service below and drops it afterwards (see scripts/e2e-env.mjs).
name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # MySQL 8.4 with its defaults (ONLY_FULL_GROUP_BY on), data kept in memory (tmpfs). Locally the tests run on
      # whatever server the backend's .env points at, e.g. MariaDB from XAMPP.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e-root
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pe2e-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      CI: 'true'
      BACKEND_DIR: backend
      # The database server for the e2e databases (the name is always ticketflow_e2e_*, chosen per run)
      E2E_DB_HOST: 127.0.0.1
      E2E_DB_PORT: '3306'
      E2E_DB_USER: root
      E2E_DB_PASSWORD: e2e-root

    steps:
      - name: Check out the frontend
        uses: actions/checkout@v7

      - name: Check out the backend
        uses: actions/checkout@v7
        with:
          repository: enesasejdiu/Ctrl-HelpBackend
          path: backend
          # Needed only if the backend repo is private: a token with read access, saved as a repo secret
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run e2e tests
        run: npm run e2e

      # The same app with email not set up on the backend: new and reset passwords are temporary ones
      - name: Run e2e tests (temporary-password mode)
        run: npm run e2e:temporary-passwords -- --project=chromium

      # The run must drop its database, also when tests failed
      - name: Check no e2e database is left
        if: always()
        run: E2E_DB_NAME=ticketflow_e2e_check node scripts/e2e-backend.mjs check-clean

      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results/
          retention-days: 14
