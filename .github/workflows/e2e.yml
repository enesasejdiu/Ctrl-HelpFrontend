# End-to-end tests: frontend + backend on a throwaway database, driven by Playwright.
# The backend lives in its own repo and is checked out next to the frontend. Each run creates its own
# ticketflow_e2e_* database on the MySQL service below and drops it afterwards (see scripts/e2e-env.mjs).
name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # MySQL 8.4 with its defaults (ONLY_FULL_GROUP_BY on), data kept in memory (tmpfs). Locally the tests run on
      # whatever server the backend's .env points at, e.g. MariaDB from XAMPP.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e-root
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pe2e-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      CI: 'true'
      BACKEND_DIR: backend
      # The database server for the e2e databases (the name is always ticketflow_e2e_*, chosen per run)
      E2E_DB_HOST: 127.0.0.1
      E2E_DB_PORT: '3306'
      E2E_DB_USER: root
      E2E_DB_PASSWORD: e2e-root

    steps:
      - name: Check out the frontend
        uses: actions/checkout@v7

      - name: Check out the backend
        uses: actions/checkout@v7
        with:
          repository: enesasejdiu/Ctrl-HelpBackend
          path: backend
          # Needed only if the backend repo is private: a token with read access, saved as a repo secret
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run e2e tests
        run: npm run e2e

      # Paging and sorting against the real backend, 3 times in a row with no retries: they must pass every time
      - name: Repeat the pagination e2e tests (3 runs, no retries)
        run: npx playwright test e2e/pagination.spec.ts --project=chromium --repeat-each=3 --retries=0

      # The same app with email not set up on the backend: new and reset passwords are temporary ones
      - name: Run e2e tests (temporary-password mode)
        run: npm run e2e:temporary-passwords -- --project=chromium

      # The run must drop its database, also when tests failed
      - name: Check no e2e database is left
        if: always()
        run: E2E_DB_NAME=ticketflow_e2e_check node scripts/e2e-backend.mjs check-clean

      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  # A rehearsal of npm run e2e:staging (playwright.staging.config.ts), so the staging setup is known to work before
  # it ever points at the shared server: a backend with email off (temporary passwords) on a throwaway database, and
  # the frontend, stand in for staging on localhost. The staging run uses them only through the API, like staging:
  # the seeded admin's login comes from STAGING_ADMIN_*, the run makes its own e2e-<runId>-… employee and agent, and
  # the teardown cleans up (test-results/staging-cleanup.json). Then the throwaway database is dropped.
  staging-rehearsal:
    name: staging rehearsal (localhost)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e-root
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pe2e-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      CI: 'true'
      BACKEND_DIR: backend
      E2E_DB_HOST: 127.0.0.1
      E2E_DB_PORT: '3306'
      E2E_DB_USER: root
      E2E_DB_PASSWORD: e2e-root
      # Fixed for this job, so the backend, the frontend and the drop at the end agree (scripts/e2e-env.mjs)
      E2E_DB_NAME: ticketflow_e2e_staging_rehearsal
      E2E_API_PORT: '5181'
      E2E_WEB_PORT: '5182'
      E2E_PASSWORD_DELIVERY: temporary_password

    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: enesasejdiu/Ctrl-HelpBackend
          path: backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: |
          npm ci
          npm ci --prefix backend
          npx playwright install --with-deps chromium

      - name: Start the stand-in for staging (backend + frontend on localhost)
        run: |
          node scripts/e2e-backend.mjs start > backend.log 2>&1 &
          API_PROXY_TARGET=http://localhost:5181 VITE_API_URL=/api VITE_SENTRY_DSN= npx vite --port 5182 --strictPort > frontend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5182/api/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:5182/api/health

      - name: npm run e2e:staging against it
        env:
          STAGING_URL: http://localhost:5182
          STAGING_ADMIN_EMAIL: admin@ticketflow.local
          STAGING_ADMIN_PASSWORD: password123
        run: npm run e2e:staging

      - name: The cleanup report
        if: always()
        run: cat test-results/staging-cleanup.json || true

      - name: Upload the staging report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: staging-rehearsal
          path: |
            playwright-report-staging/
            test-results/staging/
            backend.log
            frontend.log
          retention-days: 14

      - name: Drop the throwaway database
        if: always()
        run: node scripts/e2e-backend.mjs drop

  # The frontend image's nginx in front of the REAL backend: the whole stack from docker-compose.example.yml (both
  # images built from source, the backend with NODE_ENV=production, MySQL), on a throwaway database with demo data,
  # checked by docker/verify-stack.sh (/api prefix kept, sessions and CSRF through the proxy, the visitor's IP in the
  # audit log, the upload limit). Also proves the compose example itself still starts. Nothing is pushed anywhere.
  stack:
    name: stack (nginx + real backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The two repos side by side, as docker-compose.example.yml expects
      - uses: actions/checkout@v7
        with:
          path: Ctrl-HelpFrontend
      - uses: actions/checkout@v7
        with:
          repository: enesasejdiu/Ctrl-HelpBackend
          path: Ctrl-HelpBackend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}

      # Random values made for this run only; the stack and its database are thrown away at the end
      - name: The compose file and throwaway secrets
        run: |
          cp Ctrl-HelpFrontend/docker-compose.example.yml docker-compose.yml
          {
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 48)"
          } > .env

      - name: Start the stack (build both images, migrate, start)
        run: |
          docker compose -p stack up -d --build
          for i in $(seq 1 90); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' stack-web-1 2>/dev/null)" = healthy ] && break
            sleep 2
          done
          docker compose -p stack ps -a
          test "$(docker inspect --format '{{.State.Health.Status}}' stack-web-1)" = healthy

      # The demo users and tickets (the database is brand new and thrown away with the run)
      - name: Demo data
        run: docker compose -p stack exec -T api node scripts/seed.js

      - name: Check nginx against the real backend (docker/verify-stack.sh)
        run: bash Ctrl-HelpFrontend/docker/verify-stack.sh http://localhost:8080 stack-web-1

      - name: Logs
        if: always()
        run: docker compose -p stack logs --no-color --tail 60 web api migrate || true

      - name: Remove the stack and its data
        if: always()
        run: docker compose -p stack down -v || true
