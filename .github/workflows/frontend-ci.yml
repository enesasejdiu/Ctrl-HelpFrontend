# Frontend CI: lint, unit tests, production build and the Docker image, as four parallel jobs.
# Branch protection: require only the "ci-ok" check, which passes when all three do.
# (End-to-end tests run separately in e2e.yml.)
name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR cancels its older, still-running run; runs on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Every file must match the Prettier style in .prettierrc.json (fix locally with npm run format)
      - run: npm run format:check
      # oxlint (the project's linter); any warning fails the job
      - run: npm run lint -- --max-warnings=0 --format=github

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Single run (no watch). The github-actions reporter annotates failures on the PR's changed lines.
      # Only src/**/*.test.* is included (vite.config.js), so the Playwright specs in e2e/ are not picked up.
      - name: Run unit tests with coverage
        run: >-
          npx vitest run --coverage
          --reporter=default --reporter=github-actions
          --coverage.reporter=text --coverage.reporter=html --coverage.reporter=json-summary
      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e "
            const total = require('./coverage/coverage-summary.json').total;
            const rows = ['statements', 'branches', 'functions', 'lines']
              .map((k) => '| ' + k + ' | ' + total[k].pct + '% | ' + total[k].covered + ' / ' + total[k].total + ' |');
            console.log(['### Unit test coverage', '', '| Metric | Coverage | Covered |', '| --- | --- | --- |', ...rows].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always() && hashFiles('coverage/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # VITE_API_URL is public (it ends up in the bundle), not a secret; this placeholder only proves the build works.
      # Deployments build with their real API URL.
      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid/api
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Builds the production image (Dockerfile: Vite build + nginx) without pushing it anywhere, then runs it against a
  # stub backend and checks it like a browser and an operator would (docker/verify.sh, docker/check-csp.mjs), so a
  # broken Dockerfile, .dockerignore, nginx config, header or Content-Security-Policy turns CI red.
  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Lint the Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile
      - name: Build the web image (no push)
        run: docker build --tag ticketflow-web:ci --build-arg VCS_REF="$GITHUB_SHA" .
      - name: Check the nginx config
        run: docker run --rm ticketflow-web:ci sh -c '/docker-entrypoint.sh nginx -t'
      - name: Image size and labels
        run: |
          docker image ls ticketflow-web:ci
          size=$(docker image inspect --format '{{.Size}}' ticketflow-web:ci)
          echo "Image size: $((size / 1024 / 1024)) MB"
          docker image inspect --format '{{json .Config.Labels}}' ticketflow-web:ci
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' ticketflow-web:ci)" = "$GITHUB_SHA"
      - name: Start a stub backend and the web container
        run: |
          docker network create tf
          docker run -d --name stub --network tf --network-alias api-stub -v "$PWD/docker:/stub:ro" \
            node:22.22-alpine node /stub/stub-backend.mjs
          docker run -d --name web --network tf -p 8080:8080 -e BACKEND_URL=http://api-stub:5050 ticketflow-web:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' web)" = healthy ] && break
            sleep 2
          done
          docker ps
      - name: Check the running container (docker/verify.sh)
        run: bash docker/verify.sh http://localhost:8080 web
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Open the app in Chromium with the real CSP (docker/check-csp.mjs)
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node docker/check-csp.mjs http://localhost:8080
      - name: The older API_URL name still works
        run: |
          docker run -d --name web-old --network tf -p 8081:8080 -e API_URL=http://api-stub:5050 ticketflow-web:ci
          sleep 3
          curl -sf http://localhost:8081/api/health | grep -q '"stub":true'
      - name: A source-only change reuses the npm ci layer
        run: |
          echo "// cache check" >> src/main.jsx
          docker build --progress=plain --tag ticketflow-web:ci-rebuild . 2>&1 | tee rebuild.log | grep -E "npm ci|CACHED" || true
          grep -E "RUN npm ci" -A1 rebuild.log | grep -q CACHED
          git checkout -- src/main.jsx
      - name: Container logs
        if: always()
        run: |
          docker logs web 2>&1 | tail -40 || true
          docker logs stub 2>&1 | tail -10 || true

  # The one check to require in branch protection: green only when every job above succeeded
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, test, build, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: All jobs passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: echo "lint, test, build and docker all passed"
      - name: A job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "Results: lint=${{ needs.lint.result }}, test=${{ needs.test.result }}, build=${{ needs.build.result }}, docker=${{ needs.docker.result }}"
          exit 1
