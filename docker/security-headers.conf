# Security headers for every answer from the frontend image (included by default.conf.template).
# Content-Security-Policy, what the app needs and nothing else:
#   scripts, styles, images, fonts and API calls from this origin; the Inter font from Google Fonts (index.html);
#   data: images (the select arrow in index.css); error reports to Sentry when VITE_SENTRY_DSN is set.
#   No inline scripts, no plugins, no framing, forms only post here.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.sentry.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# $referrer_policy: no-referrer on /set-password and /forgot-password, else strict-origin-when-cross-origin (the map
# in default.conf.template)
add_header Referrer-Policy $referrer_policy always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
