# Security headers for every answer from the frontend image (included by default.conf.template). The values are maps
# in default.conf.template: the page's values everywhere, empty (no header) for /api/, where the API sends its own.
# Content-Security-Policy, what the app needs and nothing else:
#   scripts, styles, images, fonts and API calls from this origin; the Inter font from Google Fonts (index.html);
#   data: images (the select arrow in index.css); error reports to Sentry when VITE_SENTRY_DSN is set.
#   No inline scripts, no plugins, no framing, forms only post here.
add_header Content-Security-Policy $page_csp always;
add_header X-Content-Type-Options $page_nosniff always;
add_header X-Frame-Options $page_frame_options always;
# $referrer_policy: no-referrer on /set-password and /forgot-password, else strict-origin-when-cross-origin (the map
# in default.conf.template)
add_header Referrer-Policy $referrer_policy always;
add_header Permissions-Policy $page_permissions_policy always;
